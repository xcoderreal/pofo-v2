name: Prod Heartbeat

# Prod heartbeat: runs the smoke suite against the deployed URL every
# 5 minutes. DISABLED by default — uncomment the `schedule` trigger and
# set SKELETON_E2E_URL (or the PROD_URL repo variable) once you have a
# prod deploy to point at.
#
# Writes are automatically disabled against non-local URLs, so this is
# safe to run against prod — it'll GET /health, GET /items, and 404-check
# an unknown route. To allow write tests (POST roundtrip) against prod,
# set SKELETON_E2E_ALLOW_WRITES=1 in the env below. Don't do that unless
# you have a dedicated test tenant.

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to smoke-test (e.g. https://api.example.com)"
        required: true

defaults:
  run:
    working-directory: apps/api

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # Use the workflow_dispatch input when triggered manually, or the
      # PROD_URL repo variable when triggered by cron.
      SKELETON_E2E_URL: ${{ inputs.url || vars.PROD_URL }}
      # SKELETON_E2E_ALLOW_WRITES: "0"   # keep disabled against prod
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      - name: Smoke prod
        run: uv run pytest tests/smoke/ -v
