name: Backend CI

on:
  push:
    branches: [main]
    paths: [apps/api/**]
  pull_request:
    paths: [apps/api/**]

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      - run: uv run ruff check src/ tests/

      - run: uv run ruff format --check src/ tests/

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      - run: uv run pytest tests/unit/

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      - run: uv run pytest tests/integration/

  test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - run: uv sync --all-extras --frozen

      # tests/smoke/ uses the conftest base_url fixture, which spawns
      # uvicorn on a random free port. No service matrix needed.
      - run: uv run pytest tests/smoke/ -v
