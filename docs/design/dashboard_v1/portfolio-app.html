document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

],[]],\n  ['a2','VTI',[[15,90],[380,30]],[]],\n  ['a2','SCHD',[[90,200]],[]],\n  ['a2','MSFT',[[250,35]],[]],\n  ['a2','NVDA',[[460,10]],[]],\n  ['a3','VOO',[[5,140]],[]],\n  ['a3','VTI',[[5,60]],[]],\n  ['a3','MSFT',[[100,50]],[]],\n  ['a4','BTC',[[80,0.6],[500,0.25]],[]],\n  ['a4','ETH',[[110,6]],[[600,2]]]\n];\nconst CASHTX = [['a5',12,48000],['a5',300,9000],['a5',560,-4000],['a1',2,3000],['a2',2,1500],['a3',2,800],['a4',60,1200]];\nconst METRICS = [\n  {k:'equity', label:'Equity value', note:'Market value of holdings'},\n  {k:'cash_balance', label:'Cash balance', note:'Uninvested cash'},\n  {k:'unrealized_gain', label:'Unrealized gain', note:'Market value − cost basis'},\n  {k:'realized_gain', label:'Realized gain', note:'Booked on sells · shown as bars'},\n  {k:'cost_basis', label:'Cost basis', note:'What you paid, average cost'},\n  {k:'share_count', label:'Share count', note:'One instrument only'},\n  {k:'market_price', label:'Market price', note:'One instrument only'}\n];\nconst RANGES = [{k:'1W',d:7},{k:'1M',d:31},{k:'3M',d:92},{k:'6M',d:183},{k:'1Y',d:366},{k:'2Y',d:730}];\nconst AUTOGRAN = {'1W':'daily','1M':'daily','3M':'weekly','6M':'weekly','1Y':'monthly','2Y':'monthly'};\nconst GRANS = ['daily','weekly','monthly','yearly'];\nconst UP = 'oklch(0.79 0.16 152)', DOWN = 'oklch(0.66 0.19 25)', DIM = '#8A9099';\n\nfunction rng(seed){let a=seed>>>0;return function(){a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}\nfunction seedOf(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}\n\nclass Component extends DCLogic {\n  state = {\n    nav:'portfolio', level:'portfolio', acct:null, sym:null,\n    metric:'equity', rangeKey:(this.props.defaultRange||'1Y'), gran:null,\n    tab:'holdings', scrubbing:false, scrubIdx:null, pinA:null, pinB:null,\n    sheet:null, cum:false, showClosed:false, txnType:'buy'\n  };\n\n  build(){\n    if(this._d) return this._d;\n    const today = new Date(2026,7,1);\n    const dates=[]; for(let i=0;i<DAYS;i++){const dt=new Date(today); dt.setDate(dt.getDate()-(DAYS-1-i)); dates.push(dt);}\n    const px={};\n    INSTR.forEach(ins=>{ const r=rng(seedOf(ins.sym)); let p=ins.p0; const arr=[];\n      for(let i=0;i<DAYS;i++){ const z=(r()+r()+r()-1.5)*1.5; p=Math.max(p*Math.exp(ins.dr+ins.vol*z), ins.p0*0.08); arr.push(p); }\n      px[ins.sym]=arr; });\n    const keys=[], cash={}, flows={}, txns=[];\n    ACCTS.forEach(a=>{ cash[a.id]=new Array(DAYS).fill(0); flows[a.id]=new Array(DAYS).fill(0); });\n    CASHTX.forEach(([acct,day,amt])=>{ flows[acct][day]+=amt; txns.push({day, acct, sym:null, type: amt>0?'deposit':'withdraw', qty:null, price:null, amount:Math.abs(amt), realized:null}); });\n    POS.forEach(([acct,sym,lots,sells])=>{\n      const shares=new Array(DAYS).fill(0), cost=new Array(DAYS).fill(0), real=new Array(DAYS).fill(0);\n      const ev=[]; lots.forEach(([d,q])=>ev.push({d,q,sell:false})); sells.forEach(([d,q])=>ev.push({d,q,sell:true}));\n      ev.sort((a,b)=>a.d-b.d);\n      let sh=0, cb=0, rl=0, ei=0;\n      for(let i=0;i<DAYS;i++){\n        while(ei<ev.length && ev[ei].d===i){\n          const e=ev[ei], p=px[sym][i];\n          if(!e.sell){ sh+=e.q; cb+=e.q*p; flows[acct][Math.max(0,i-1)]+=e.q*p*1.06; flows[acct][i]-=e.q*p;\n            txns.push({day:i, acct, sym, type:'buy', qty:e.q, price:p, amount:e.q*p, realized:null}); }\n          else { const avg=sh>0?cb/sh:0, q=Math.min(e.q,sh); const r=q*(p-avg); rl+=r; cb-=q*avg; sh-=q; flows[acct][i]+=q*p;\n            txns.push({day:i, acct, sym, type:'sell', qty:q, price:p, amount:q*p, realized:r}); }\n          ei++;\n        }\n        shares[i]=sh; cost[i]=cb; real[i]=rl;\n      }\n      keys.push({acct,sym,shares,cost,real});\n    });\n    ACCTS.forEach(a=>{ let c=0; for(let i=0;i<DAYS;i++){ c+=flows[a.id][i]; cash[a.id][i]=Math.max(c,0);} });\n    txns.sort((a,b)=>b.day-a.day);\n    this._d={dates,px,keys,cash,txns};\n    return this._d;\n  }\n\n  filt(){ const s=this.state; return {syms:s.sym?[s.sym]:null, accts:s.acct?[s.acct]:null}; }\n  matches(k,f){ return (!f.syms||f.syms.indexOf(k.sym)>=0) && (!f.accts||f.accts.indexOf(k.acct)>=0); }\n\n  daily(metric,f){\n    const key=metric+'|'+(f.syms||['*']).join(',')+'|'+(f.accts||['*']).join(',');\n    this._memo=this._memo||{}; if(this._memo[key]) return this._memo[key];\n    const d=this.build(); const out=new Array(DAYS).fill(0);\n    if(metric==='cash_balance'){ ACCTS.forEach(a=>{ if(f.accts&&f.accts.indexOf(a.id)<0) return; for(let i=0;i<DAYS;i++) out[i]+=d.cash[a.id][i]; }); }\n    else if(metric==='market_price'){ const sym=(f.syms&&f.syms[0])||'GOOG'; for(let i=0;i<DAYS;i++) out[i]=d.px[sym][i]; }\n    else { d.keys.forEach(k=>{ if(!this.matches(k,f)) return; const p=d.px[k.sym];\n      for(let i=0;i<DAYS;i++){\n        if(metric==='equity') out[i]+=k.shares[i]*p[i];\n        else if(metric==='cost_basis') out[i]+=k.cost[i];\n        else if(metric==='share_count') out[i]+=k.shares[i];\n        else if(metric==='unrealized_gain') out[i]+=k.shares[i]*p[i]-k.cost[i];\n        else if(metric==='realized_gain') out[i]+=k.real[i];\n      }}); }\n    this._memo[key]=out; return out;\n  }\n\n  series(){\n    const s=this.state, f=this.filt(), d=this.build();\n    const days=(RANGES.find(r=>r.k===s.rangeKey)||RANGES[4]).d;\n    const start=Math.max(0, DAYS-1-days);\n    const raw=this.daily(s.metric,f);\n    const gran=s.gran||AUTOGRAN[s.rangeKey];\n    const flow = s.metric==='realized_gain' && !s.cum;\n    const buckets=[];\n    const kf=(dt)=> gran==='daily'?dt.toISOString().slice(0,10)\n      : gran==='weekly'?(()=>{const t=new Date(dt);t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10);})()\n      : gran==='monthly'?dt.getFullYear()+'-'+dt.getMonth() : ''+dt.getFullYear();\n    let cur=null;\n    for(let i=start;i<DAYS;i++){ const k=kf(d.dates[i]);\n      if(!cur||cur.k!==k){ cur={k,i0:i,i:i}; buckets.push(cur);} cur.i=i; cur.end=d.dates[i]; }\n    const pts=buckets.map((b,j)=>{ let v;\n      if(flow){ const prev = j===0? raw[Math.max(start-1,0)] : raw[buckets[j-1].i]; v=raw[b.i]-prev; }\n      else v=raw[b.i];\n      return {v, date:b.end}; });\n    return {pts, gran, flow};\n  }\n\n  usd(v,dp){ const n=Math.abs(v); return (v<0?'−':'')+'$'+n.toLocaleString('en-US',{minimumFractionDigits:dp===undefined?2:dp,maximumFractionDigits:dp===undefined?2:dp}); }\n  money(v){ return this.usd(v, Math.abs(v)>=10000?0:2); }\n  signed(v){ return (v>=0?'+':'−')+this.usd(Math.abs(v), Math.abs(v)>=10000?0:2); }\n  pct(v){ return (v>=0?'+':'−')+Math.abs(v).toFixed(2)+'%'; }\n  qty(v){ return v.toLocaleString('en-US',{maximumFractionDigits:v<10?4:2}); }\n  dlabel(d,g){ if(g==='yearly') return ''+d.getFullYear();\n    if(g==='monthly') return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});\n    if(g==='weekly') return 'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'});\n    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }\n  metricVal(v){ const m=this.state.metric; if(m==='share_count') return this.qty(v)+' sh'; if(m==='market_price') return this.usd(v); return this.money(v); }\n\n  idxFrom(e){ const el=this._chart; if(!el) return 0;\n    const r=el.getBoundingClientRect(), n=this._n||1;\n    const f=Math.min(1,Math.max(0,(e.clientX-r.left)/Math.max(r.width,1)));\n    return Math.round(f*(n-1)); }\n  onDown=(e)=>{ try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){} this._x0=e.clientX; this._moved=false; this.setState({scrubbing:true, scrubIdx:this.idxFrom(e)}); };\n  onMove=(e)=>{ if(!this.state.scrubbing) return; if(Math.abs(e.clientX-this._x0)>6) this._moved=true; this.setState({scrubIdx:this.idxFrom(e)}); };\n  onUp=(e)=>{ const i=this.idxFrom(e);\n    if(this._moved){ this.setState({scrubbing:false, scrubIdx:null}); return; }\n    const compare=this.props.compareTaps!==false, s=this.state;\n    if(compare && s.pinA!==null && s.pinB===null && i!==s.pinA) this.setState({scrubbing:false, scrubIdx:null, pinB:i});\n    else if(s.pinA===i && s.pinB===null) this.setState({scrubbing:false, scrubIdx:null, pinA:null, pinB:null});\n    else this.setState({scrubbing:false, scrubIdx:null, pinA:i, pinB:null}); };\n  onLeave=()=>{ if(this.state.scrubbing) this.setState({scrubbing:false, scrubIdx:null}); };\n\n  go(patch){ this.setState(Object.assign({scrubIdx:null, scrubbing:false, pinA:null, pinB:null, sheet:null, showClosed:false}, patch)); }\n  hasInstr(id){ const d=this.build(); return d.keys.some(k=>k.acct===id && k.shares[DAYS-1]>0); }\n  gotoAcct(id, nav){ const p={level:'account', acct:id, tab:'holdings'};\n    if(nav) p.nav=nav;\n    if(!this.hasInstr(id) && ['equity','cost_basis','unrealized_gain'].indexOf(this.state.metric)>=0) p.metric='cash_balance';\n    else if(this.state.metric==='cash_balance' && this.hasInstr(id)) p.metric='equity';\n    this.go(p); }\n  slice(sym,acct){ const p={nav:'portfolio', sym, acct, level: acct?'slice':'instrument', tab:'holdings'};\n    if(this.state.metric==='cash_balance') p.metric='equity';\n    this.go(p); }\n\n  statics(){\n    if(this._st) return this._st;\n    const d=this.build(), last=DAYS-1;\n    const bySym={};\n    d.keys.forEach(k=>{ const o=bySym[k.sym]||(bySym[k.sym]={sym:k.sym, shares:0, mv:0, cb:0, nAcct:0});\n      o.shares+=k.shares[last]; o.mv+=k.shares[last]*d.px[k.sym][last]; o.cb+=k.cost[last];\n      if(k.shares[last]>0) o.nAcct++; });\n    const mk=(vals,w,h)=>{ const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), r=(mx-mn)||1;\n      return vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*w).toFixed(1)+' '+(h-2-((v-mn)/r)*(h-4)).toFixed(1)).join(' '); };\n    const merged=Object.values(bySym).filter(o=>o.shares>0).sort((a,b)=>b.mv-a.mv);\n    const eq=this.daily('equity',{syms:null,accts:null}), cashAll=this.daily('cash_balance',{syms:null,accts:null});\n    const tot=[]; for(let i=0;i<DAYS;i++) tot.push(eq[i]+cashAll[i]);\n    const yrAgo=tot[DAYS-366];\n    const acctRows=ACCTS.map(a=>{\n      const mvS=this.daily('equity',{syms:null,accts:[a.id]}), cbS=this.daily('cost_basis',{syms:null,accts:[a.id]});\n      const mv=mvS[last]+d.cash[a.id][last], cb=cbS[last], gl=cb>0?((mvS[last]-cb)/cb*100):0;\n      const v=[]; for(let i=DAYS-260;i<DAYS;i+=13) v.push(mvS[i]+d.cash[a.id][i]);\n      const flat=Math.max.apply(null,v)-Math.min.apply(null,v)<1;\n      return {id:a.id, name:a.name, hue:a.hue, sub:a.kind, raw:mv, mv:this.money(mv), gl: cb>0?this.pct(gl):'—',\n        sc: cb>0?(gl>=0?UP:DOWN):DIM, spark: flat?'M0 9 L46 9':mk(v,46,18)}; });\n    const segsRaw=acctRows.filter(r=>r.raw>1).sort((a,b)=>b.raw-a.raw);\n    const segTot=segsRaw.reduce((a,s)=>a+s.raw,0);\n    const allocSegs=segsRaw.map(s=>({id:s.id, name:ACCTS.find(a=>a.id===s.id).short, hue:s.hue,\n      w:(s.raw/segTot*100).toFixed(1)+'%', pct:Math.round(s.raw/segTot*100)+'%'}));\n    this._st={merged, acctRows, allocSegs, total:tot[last], totalDelta:this.pct((tot[last]-yrAgo)/yrAgo*100)+'  '+this.signed(tot[last]-yrAgo)};\n    return this._st;\n  }\n\n  renderVals(){\n    const s=this.state, d=this.build(), st=this.statics(), last=DAYS-1, px=d.px;\n    const accent=this.props.accent||UP;\n    const {pts, gran, flow}=this.series();\n    this._n=pts.length;\n    const vals=pts.map(p=>p.v);\n    const isBars = s.metric==='realized_gain' && !s.cum;\n    const W=358, H=168, PAD=10;\n    let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);\n    if(s.metric==='realized_gain'||s.metric==='unrealized_gain'){ mn=Math.min(mn,0); mx=Math.max(mx,0); }\n    if(mx-mn<1e-6) mx=mn+1;\n    const rr=mx-mn;\n    const X=i=> pts.length<2?W/2:(i/(pts.length-1))*W;\n    const Y=v=> H-PAD-((v-mn)/rr)*(H-PAD*2);\n    const pathD=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');\n    const areaD=pathD+' L'+W+' '+H+' L0 '+H+' Z';\n    const bw=Math.max(2, W/Math.max(pts.length,1)*0.62);\n    const zeroY=Y(0);\n    const barX=i=> pts.length<2?(W-bw)/2 : (i/(pts.length-1))*(W-bw);\n    const bars=pts.map((p,i)=>{ const y=Y(p.v); return {x:barX(i).toFixed(1), y:Math.min(y,zeroY).toFixed(1), w:bw.toFixed(1), h:Math.max(1.5,Math.abs(zeroY-y)).toFixed(1), fill:p.v>=0?accent:DOWN}; });\n\n    const li=pts.length-1;\n    let vi=li, mode='latest';\n    if(s.scrubbing && s.scrubIdx!==null){ vi=Math.min(s.scrubIdx,li); mode='scrub'; }\n    else if(s.pinA!==null && s.pinB!==null){ vi=Math.min(s.pinB,li); mode='ab'; }\n    else if(s.pinA!==null){ vi=Math.min(s.pinA,li); mode='pin'; }\n    const v0=vals[0], dv=(a,b)=> b===0?null:(a-b)/Math.abs(b)*100;\n    const flowTotal=vals.reduce((a,b)=>a+b,0);\n    let deltaMain, deltaSub, deltaColor;\n    if(mode==='scrub'){\n      const prev= vi>0?vals[vi-1]:vals[0], dPrev=vals[vi]-prev, dStart=vals[vi]-v0;\n      deltaMain=this.signed(dPrev)+' vs prev';\n      deltaSub=this.dlabel(pts[vi].date,gran)+'  ·  '+this.signed(dStart)+' from start';\n      deltaColor=dPrev>=0?accent:DOWN;\n    } else if(mode==='ab'){\n      const a=Math.min(s.pinA,s.pinB), b=Math.max(s.pinA,s.pinB), diff=vals[b]-vals[a], p=dv(vals[b],vals[a]);\n      deltaMain=this.signed(diff);\n      deltaSub=this.dlabel(pts[a].date,gran)+' → '+this.dlabel(pts[b].date,gran)+(p===null?'':'  ·  '+this.pct(p));\n      deltaColor=diff>=0?accent:DOWN;\n    } else if(mode==='pin'){\n      const dStart=vals[vi]-v0;\n      deltaMain=this.signed(dStart);\n      deltaSub=this.dlabel(pts[vi].date,gran)+'  ·  pinned · tap again to compare';\n      deltaColor=dStart>=0?accent:DOWN;\n    } else if(flow){\n      deltaMain=this.dlabel(pts[0].date,gran)+' → '+this.dlabel(pts[li].date,gran);\n      deltaSub=pts.length+' '+gran.replace('ly','')+' buckets';\n      deltaColor=flowTotal>=0?accent:DOWN;\n    } else {\n      const dStart=vals[li]-v0, p=dv(vals[li],v0);\n      deltaMain=this.signed(dStart)+(p===null?'':'  '+this.pct(p));\n      deltaSub= s.rangeKey==='2Y'?'past 2 years':'past '+s.rangeKey.replace('W',' week').replace('M',' months').replace('Y',' year');\n      deltaColor=dStart>=0?accent:DOWN;\n    }\n    const cross=(s.scrubbing && s.scrubIdx!==null)?{x:X(Math.min(s.scrubIdx,li)).toFixed(1), y:Y(vals[Math.min(s.scrubIdx,li)]).toFixed(1)}:false;\n    const pins=[s.pinA,s.pinB].filter(i=>i!==null&&i<=li).map(i=>({x:X(i).toFixed(1), y:Y(vals[i]).toFixed(1)}));\n    const pinBand=(s.pinA!==null&&s.pinB!==null)?{x:Math.min(X(s.pinA),X(s.pinB)).toFixed(1), w:Math.abs(X(s.pinB)-X(s.pinA)).toFixed(1)}:false;\n\n    const rows=[], closedRows=[]; let emptyMsg=false, emptySub='', sectionTitle='', statCard=false, stats=[];\n    const STRIPE='repeating-linear-gradient(135deg,#191D23 0 3px,#12151A 3px 6px)';\n    const initials=(n)=>n.split(' ').map(w=>w[0]).join('').slice(0,3);\n    if(s.level==='portfolio' && s.tab==='accounts' && !s.sym){\n      sectionTitle='Accounts';\n      st.acctRows.forEach(a=>rows.push({av:initials(a.name), avBg:'#15181D', avFg:'#9AA2AC', t1:a.name, t2:a.sub, v1:a.mv, v2:a.gl, v2c:a.sc, onTap:()=>this.gotoAcct(a.id)}));\n    } else if(s.sym && !s.acct){\n      const held=d.keys.filter(k=>k.sym===s.sym);\n      const sh=held.reduce((a,k)=>a+k.shares[last],0), cb=held.reduce((a,k)=>a+k.cost[last],0);\n      const mv=sh*px[s.sym][last], rl=held.reduce((a,k)=>a+k.real[last],0);\n      statCard=true;\n      stats=[{k:'Shares', v:this.qty(sh), c:'#EAEEF3'},{k:'Market price', v:this.usd(px[s.sym][last]), c:'#EAEEF3'},\n        {k:'Avg cost', v: sh>0?this.usd(cb/sh):'—', c:'#EAEEF3'},{k:'Unrealized', v: sh>0?this.signed(mv-cb):'—', c: mv-cb>=0?accent:DOWN},\n        {k:'Realized (all time)', v:this.signed(rl), c: rl>=0?accent:DOWN},{k:'Cost basis', v:this.money(cb), c:'#EAEEF3'}];\n      sectionTitle='Across your accounts';\n      held.forEach(k=>{ const a=ACCTS.find(x=>x.id===k.acct), kmv=k.shares[last]*px[s.sym][last], kcb=k.cost[last];\n        const gl=kcb>0?(kmv-kcb)/kcb*100:0;\n        const row={av:initials   const groups=[]; let gcur=null;\n    acts.forEach(t=>{\n      const dt=d.dates[t.day], key=dt.getFullYear()+'-'+dt.getMonth();\n      if(!gcur||gcur.key!==key){ gcur={key, label:dt.toLocaleDateString('en-US',{month:'long',year:'numeric'}), rows:[], netv:0}; groups.push(gcur); }\n      const a=ACCTS.find(x=>x.id===t.acct);\n      const badge = t.type==='buy'?'BUY': t.type==='sell'?'SELL': t.type==='deposit'?'DEP':'WDL';\n      const bg = t.type==='buy'?'#152018': t.type==='sell'?'#231519': t.type==='deposit'?'#151A24':'#1C1A15';\n      const fg = t.type==='buy'?'#8FBFA1': t.type==='sell'?'#D99AA2': t.type==='deposit'?'#9DB4D9':'#C7B48A';\n      gcur.netv += (t.type==='buy'||t.type==='withdraw')? -t.amount : t.amount;\n      gcur.rows.push({badge, badgeBg:bg, badgeFg:fg,\n        t1: t.sym? t.sym+' · '+this.qty(t.qty)+' sh @ '+this.usd(t.price) : (t.type==='deposit'?'Cash deposit':'Cash withdrawal'),\n        t2: a.short+' · '+dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),\n        v1: (t.type==='buy'||t.type==='withdraw'?'−':'+')+this.usd(t.amount,0),\n        v2: t.realized!==null? this.signed(t.realized)+' realized' : '',\n        v2c: t.realized!==null? (t.realized>=0?accent:DOWN) : '#6C737D'});\n    });\n    const actGroups=groups.map(g=>({label:g.label, rows:g.rows, net:this.signed(g.netv)+' net', netc: g.netv>=0?accent:DOWN}));\n\n    // grid tab\n    const matAccts=['a1','a2','a3','a4'];\n    const matCols=matAccts.map(id=>({label:ACCTS.find(a=>a.id===id).short, onTap:()=>this.gotoAcct(id,'portfolio')}));\n    const matRows=st.merged.slice(0,7).map(m=>({ sym:m.sym, onTap:()=>this.slice(m.sym,null),\n      cells: matAccts.map(aid=>{ const k=d.keys.find(x=>x.acct===aid&&x.sym===m.sym);\n        const v=k?k.shares[last]*px[m.sym][last]:0;\n        return v>0? {v:'$'+Math.round(v/1000)+'k', bg:'#0E1115', fg:'#DDE3EA', cur:'pointer', onTap:()=>this.slice(m.sym,aid)}\n                  : {v:'·', bg:'#0B0E11', fg:'#3A4048', cur:'defaul
